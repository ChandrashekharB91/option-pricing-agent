name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,app]"
      - name: Test against QuantLib
        run: pytest -q
      - name: Regression suite (golden values and QuantLib gates)
        run: python scripts/regression.py
      - name: Comparison report
        if: always()
        run: python scripts/compare_quantlib.py
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports-py${{ matrix.python-version }}
          path: reports/
