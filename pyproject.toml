[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optlib"
version = "0.1.0"
description = "In-house option pricing library for the option pricing agent (Black-76/BSM, Greeks, implied volatility)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7", "QuantLib>=1.31"]
notebook = ["jupyterlab>=4", "matplotlib>=3.7", "pandas>=2", "QuantLib>=1.31"]
app = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "streamlit>=1.40", "plotly>=5.18", "pandas>=2",
       "anthropic>=0.40", "QuantLib>=1.31", "httpx>=0.27", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
